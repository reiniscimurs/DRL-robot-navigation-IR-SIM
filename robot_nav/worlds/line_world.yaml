world:
  height: 30  # the height of the world
  width: 70   # the height of the world
  step_time: 0.3  # 10Hz calculate each step
  sample_time: 0.3  # 10 Hz for render and data extraction
  collision_mode: 'unobstructed'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    vel_min: [ 0, -1.0 ]
    vel_max: [ 1.0, 1.0 ]
    state: [5, 15, 0, 0]
    arrive_mode: position
    goal_threshold: 0.3

    plot:
      show_trajectory: True

obstacle:
  - shape: { name: 'linestring', vertices: [ [ 5, 15 ], [ 100, 15 ] ] }  # vertices
    kinematics: {name: 'static'}
    state: [ 0, 0, 0 ]
